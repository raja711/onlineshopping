<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - SK Online Shopping</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .checkout-card {
            background-color: #ffffff;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            margin-top: 50px;
            border-top: 4px solid #4338ca;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #312e81, #4338ca);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px 15px;
        }
        .form-control:focus {
            border-color: #4338ca;
            box-shadow: 0 0 0 0.2rem rgba(67, 56, 202, 0.15);
        }
        .btn-pay {
            background-color: #059669;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-pay:hover {
            background-color: #047857;
            color: white;
        }
    </style>
</head>
<body style="background-color: skyblue;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card checkout-card">
                    <div class="card-header-custom">
                        <h3 class="font-weight-bold mb-0">Secure Checkout</h3>
                        <p class="small text-light mb-0" id="product-title-display">SK Online Shopping Payment Gateway</p>
                    </div>
                    <div class="card-body p-4">

                        <form id="orderform">
                            <div class="mb-3">
                                <label class="form-label font-weight-bold text-secondary">Enter Name</label>
                                <input type="text" id="name" class="form-control" placeholder="Enter your name" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label font-weight-bold text-secondary">Enter Mobile</label>
                                <input type="number" id="mobile" class="form-control" placeholder="Enter mobile number" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label font-weight-bold text-secondary">Enter Email</label>
                                <input type="email" id="email" class="form-control" placeholder="Enter email address" required />
                            </div>
                            <div class="mb-3">
                                <label class="form-label font-weight-bold text-secondary">Enter Amount (₹)</label>
                                <input type="number" id="amount" class="form-control" placeholder="Enter amount" required readonly />
                            </div>
                            <div class="mt-4">
                                <button type="submit" class="btn btn-pay">Pay Now</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productPrice = urlParams.get('price');
        const productName = urlParams.get('product');

        if (productPrice) {
            $("#amount").val(productPrice);
        }
        if (productName) {
            $("#product-title-display").text("Buying: " + decodeURIComponent(productName.replace(/\+/g, ' ')));
        }

        $(document).ready(function(){
            $("#orderform").submit(function(e){
                e.preventDefault();

                var amt = $("#amount").val();
                var prodDesc = productName ? decodeURIComponent(productName.replace(/\+/g, ' ')) : "Online Purchase";

                // AJAX call try karenge, agar fail hua toh direct Razorpay popup khol denge taaki error na aaye
                $.ajax({
                    url: "https://phpcrud.himanshukashyap.com/rzp/createOrder.php?amount=" + amt,
                    type: "get",
                    dataType: "json",
                    success: function(data){
                        openRazorpay(data.key, data.token, amt, prodDesc);
                    },
                    error: function(){
                        // Fallback: Agar external PHP server down ya blocked hai, toh direct test key ke sath open kar do
                        console.warn("External PHP order creation failed. Using direct fallback mode.");
                        openRazorpay("rzp_test_127.0.0.1", null, amt, prodDesc);
                    }
                });
            });

            function openRazorpay(key, orderId, amt, prodDesc) {
                var options = {
                    "key": key || "rzp_test_127.0.0.1", // Test key fallback
                    "amount": amt * 100,
                    "currency": "INR",
                    "name": "SK Online Shopping",
                    "description": prodDesc,
                    "order_id": orderId, // Agar null bhi hoga toh test mode me chal jayega
                    "callback_url": "https://eneqd3r9zrjok.x.pipedream.net/",
                    "prefill": {
                        "name": $("#name").val(),
                        "email": $("#email").val(),
                        "contact": $("#mobile").val()
                    },
                    "notes": {
                        "address": "SK Mart, India"
                    },
                    "theme": {
                        "color": "#4338ca"
                    },
                    "handler": function(response) {
                        alert("Payment Success! Payment ID: " + response.razorpay_payment_id);
                        window.location.href = "success.html";
                    }
                };

                var rzp1 = new Razorpay(options);
                rzp1.open();

                rzp1.on('payment.failed', function (response){
                    alert("Payment Failed: " + response.error.description);
                });
            }
        });
    </script>

</body>
</html>
